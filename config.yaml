receivers:
  otlp:
    protocols:
      # Loopback-only bind (127.0.0.1) — the collector is never exposed off
      # the host, on Linux or macOS alike. On a server with a routable public
      # IP (this host is a Linux VPS with no firewall) binding 0.0.0.0 would
      # expose the OTLP receiver to the internet; on a laptop loopback is
      # simply the right default. Claude Code connects from localhost over
      # gRPC (4317).
      # The HTTP (4318) receiver is intentionally omitted: Claude Code uses
      # gRPC here, and on THIS host 4318 is reserved for a separate
      # app-telemetry receiver (reached from docker sandboxes via the bridge
      # gateway 172.17.0.1:4318). On a host without that constraint you may
      # add an http: block under protocols if you need it.
      grpc:
        endpoint: 127.0.0.1:4317
      # HTTP receiver on a spare loopback port (4319) so shell/curl callers
      # — notably the livespec bd-guard wrapper — can emit OTLP/HTTP spans
      # (curl cannot speak gRPC). 4318 stays reserved for the dispatcher's
      # sandbox-telemetry receiver on the docker bridge; this is host-loopback
      # only, same non-exposed posture as the gRPC bind above.
      http:
        endpoint: 127.0.0.1:4319

  # Host resource metrics (Phase P-host of the fabro-ci-image-factoring plan).
  # Scrapers are scoped deliberately: there is NO `process` scraper — it would
  # blow up per-PID cardinality and needs root to see other users' processes.
  # Per-container attribution comes from docker_stats below instead. These
  # scrapers read world-readable /proc and /sys, so the non-root `ubuntu`
  # service user can collect them.
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      load:
      memory:
      paging:
      disk:
      filesystem:
        # Keep to real disks: exclude pseudo-filesystems and the many docker
        # overlay mounts, which would otherwise explode mount-point cardinality.
        exclude_mount_points:
          mount_points:
            - /proc/*
            - /sys/*
            - /run/*
            - /dev/*
            - /var/lib/docker/*
          match_type: regexp
        exclude_fs_types:
          fs_types:
            - autofs
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - mqueue
            - nsfs
            - overlay
            - proc
            - pstore
            - securityfs
            - selinuxfs
            - squashfs
            - sysfs
            - tmpfs
            - tracefs
          match_type: strict

  # Per-container resource attribution (Fabro sandbox vs CI runner vs Dolt).
  # Reaches the Docker API over the socket; the `ubuntu` service user is in the
  # `docker` group, so no extra grant is needed. Read-only stats.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s

processors:
  batch:
    timeout: 5s

  # Marker processor: stamps every signal (traces, metrics, logs) with proof
  # that it passed through this collector. Filter on
  # collector.otel-collector="washere" in Honeycomb to see only data that
  # went through us. Bump the version whenever this config changes
  # meaningfully so we can tell which generation produced which data.
  transform/mark:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["collector.otel-collector"], "washere")
          - set(attributes["collector.otel-collector.version"], "0.8")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["collector.otel-collector"], "washere")
          - set(attributes["collector.otel-collector.version"], "0.8")
    log_statements:
      - context: resource
        statements:
          - set(attributes["collector.otel-collector"], "washere")
          - set(attributes["collector.otel-collector.version"], "0.8")

  transform/agent_timeline:
    error_mode: ignore
    trace_statements:
      # Universal: every span gets a conversation id and an agent name.
      - context: span
        statements:
          - set(attributes["gen_ai.conversation.id"], attributes["session.id"]) where IsString(attributes["session.id"])
          - set(attributes["gen_ai.agent.name"], "Claude Code")

      # claude_code.interaction  ->  invoke_agent Claude Code
      - context: span
        conditions:
          - 'span.name == "claude_code.interaction"'
        statements:
          - set(attributes["gen_ai.operation.name"], "invoke_agent")
          - set(span.name, Concat(["invoke_agent ", attributes["gen_ai.agent.name"]], ""))

      # claude_code.llm_request  ->  chat {model}
      # Also alias the bare-namespace token counts onto the GenAI semconv so the
      # Agent Timeline tokens view picks them up. Claude Code's Detailed Beta puts
      # some tokens under gen_ai.* and some under bare keys; this fills the gap.
      - context: span
        conditions:
          - 'span.name == "claude_code.llm_request"'
        statements:
          - set(attributes["gen_ai.operation.name"], "chat")
          - set(span.name, Concat(["chat ", attributes["model"]], "")) where IsString(attributes["model"])
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where IsInt(attributes["input_tokens"])
          - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where IsInt(attributes["output_tokens"])
          - set(attributes["gen_ai.usage.cache_read_input_tokens"], attributes["cache_read_tokens"]) where IsInt(attributes["cache_read_tokens"])
          - set(attributes["gen_ai.usage.cache_creation_input_tokens"], attributes["cache_creation_tokens"]) where IsInt(attributes["cache_creation_tokens"])

      # claude_code.tool: alias tool input/result onto gen_ai.tool.call.* so the
      # AI Conversations viewer renders the tool detail panes. Requires
      # OTEL_LOG_TOOL_DETAILS=1 + OTEL_LOG_TOOL_CONTENT=1 in Claude Code. Done
      # before the rename blocks below so we match on the original span name and
      # cover both the execute_tool and Task->subagent paths.
      - context: span
        conditions:
          - 'span.name == "claude_code.tool"'
        statements:
          - set(attributes["gen_ai.tool.call.arguments"], attributes["tool_input"]) where IsString(attributes["tool_input"])
          - set(attributes["gen_ai.tool.call.result"], attributes["new_context"]) where IsString(attributes["new_context"])

      # Task tool with a known subagent  ->  invoke_agent {subagent_type}
      # (subagent_type requires OTEL_LOG_TOOL_DETAILS=1 in Claude Code)
      # Conditions joined with explicit `and` because this OTTL build appears
      # to OR the entries in the conditions array.
      - context: span
        conditions:
          - 'span.name == "claude_code.tool" and attributes["tool_name"] == "Task" and IsString(attributes["subagent_type"])'
        statements:
          - set(attributes["gen_ai.agent.name"], attributes["subagent_type"])
          - set(attributes["gen_ai.operation.name"], "invoke_agent")
          - set(span.name, Concat(["invoke_agent ", attributes["subagent_type"]], ""))

      # All other claude_code.tool spans  ->  execute_tool {tool_name}
      # Duration here includes the permission-wait child; tool_name lives only on
      # the parent .tool span, so we use it instead of claude_code.tool.execution.
      - context: span
        conditions:
          - 'span.name == "claude_code.tool" and attributes["gen_ai.operation.name"] == nil'
        statements:
          - set(attributes["gen_ai.operation.name"], "execute_tool")
          - set(attributes["gen_ai.tool.name"], attributes["tool_name"]) where IsString(attributes["tool_name"])
          - set(span.name, Concat(["execute_tool ", attributes["tool_name"]], "")) where IsString(attributes["tool_name"])

  # Split the single otlp trace stream by service.name so the livespec bd-guard
  # spans (service.name=bd-guard, emitted by the host `bd` wrapper) route to the
  # livespec Honeycomb env while everything else keeps going to agent-activity.
  # A span is DROPPED where its condition is true: `exclude_bd_guard` keeps
  # bd-guard OUT of the agent-activity pipeline; `only_bd_guard` keeps ONLY
  # bd-guard for the livespec pipeline.
  filter/exclude_bd_guard:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] == "bd-guard"'
  filter/only_bd_guard:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] != "bd-guard"'

exporters:
  otlp/honeycomb:
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

  # Host/container metrics land in their own named dataset via an explicit
  # x-honeycomb-dataset header. WITHOUT this header Honeycomb auto-routes
  # metrics to a dataset it chooses (see CLAUDE.md "Metrics auto-route in
  # Honeycomb"). Reuses the same key/env as otlp/honeycomb (the agent-activity
  # env), so host-infra metrics sit alongside the factory dispatcher/sandbox
  # trace spans they're correlated with. Phase P-host of
  # fabro-ci-image-factoring.
  otlp/honeycomb_hostmetrics:
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
      x-honeycomb-dataset: livespec-host-metrics

  # bd-guard spans -> the livespec env (its own ingest key), landing in a
  # `bd-guard` dataset alongside livespec-dispatcher/fabro-sandbox, NOT the
  # agent-activity env the other pipelines use. Key from the collector .env
  # (HONEYCOMB_INGEST_KEY_LIVESPEC); same OTLP endpoint.
  otlp/honeycomb_livespec:
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_INGEST_KEY_LIVESPEC}

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/mark, transform/agent_timeline, filter/exclude_bd_guard, batch]
      exporters: [otlp/honeycomb]
    # bd-guard spans only -> livespec env. agent_timeline shaping is
    # claude_code-specific, so it is intentionally NOT in this pipeline.
    traces/bd_guard:
      receivers: [otlp]
      processors: [transform/mark, filter/only_bd_guard, batch]
      exporters: [otlp/honeycomb_livespec]
    logs:
      receivers: [otlp]
      processors: [transform/mark, batch]
      exporters: [otlp/honeycomb]
    metrics:
      receivers: [otlp]
      processors: [transform/mark, batch]
      exporters: [otlp/honeycomb]
    # Host + per-container resource metrics on their own pipeline so they route
    # to the named livespec-host-metrics dataset (via otlp/honeycomb_hostmetrics)
    # while OTLP-received app metrics keep their existing auto-routing above.
    metrics/host:
      receivers: [hostmetrics, docker_stats]
      processors: [transform/mark, batch]
      exporters: [otlp/honeycomb_hostmetrics]
