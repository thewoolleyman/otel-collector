# config.ci-runner-host.yaml — the collector for a self-hosted CI RUNNER host
# (today: poweredge-xubuntu, the k3s + Actions Runner Controller + Kueue node
# that carries every livespec fleet repository's gating CI).
#
# This is the SECOND deployment shape of this repo, beside config.yaml (the
# factory/VPS host, agent-activity env) and config.macos.yaml (laptops). It
# exists because the CI-runner kit in livespec-dev-tooling
# (ci-runner/observability/ci-runner-heartbeat.sh) posts a liveness gauge to a
# LOCAL collector on 127.0.0.1:4319, and from 2026-08-15 to 2026-08-23 no
# collector existed on that host: the heartbeat failed 12x/hour for eight
# days and nothing noticed (livespec work-item livespec-s43svm.20). Everything
# here exports to the `livespec` Honeycomb environment — the one the fleet's
# CI telemetry (github-ci dataset) already lives in — NOT to agent-activity,
# so CI-host liveness sits beside the CI runs it gates, and so the factory
# host's single-host resource triggers on agent-activity/livespec-host-metrics
# are not contaminated by a second host's numbers.
#
# Install/upgrade on the host with scripts/install-ci-runner-host.sh (see
# README.md § "CI runner host"). Env: /etc/otel-collector/.env carries
# HONEYCOMB_INGEST_KEY_LIVESPEC (+ HONEYCOMB_API_ENDPOINT), rendered from the
# livespec 1Password Environment — never committed, never echoed.
#
# Marker: bump collector.otel-collector.version in transform/mark on every
# change to this file (same convention as config.yaml).

receivers:
  otlp:
    protocols:
      # Loopback-only, same posture as config.yaml. 4317 gRPC for SDKs; 4319
      # OTLP/HTTP is the port the ci-runner-heartbeat.sh curl POSTs to (it
      # cannot speak gRPC). 4319 rather than 4318 so the three deployment
      # shapes agree on one loopback HTTP port for shell emitters.
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4319

  # Pod-reachable, KEYLESS OTLP/HTTP receiver for the runner pool's job pods
  # (livespec-dev-tooling plan ci-runner-cache-tiers, research/003 "Why the
  # pod cannot just send to Honeycomb today"): a workflow pod cannot reach
  # loopback, and no ingest key may enter a self-hosted job, so the pool's
  # hook pod template posts its per-job cache spans (service.name=github-ci)
  # here instead. Bound to the cni0 bridge address ONLY — 10.42.0.1 is
  # reachable from the pod CIDR (10.42.0.0/24) and from this host, and from
  # nothing on the LAN or Tailscale — which is the "restricted to the pod
  # CIDR" of the contract without a firewall rule to drift. Same port as the
  # loopback HTTP listener so shell emitters carry one number. The bridge
  # exists only once k3s has created its first pod, so an early start fails
  # to bind and the unit's Restart=on-failure (5s) converges it.
  otlp/pods:
    protocols:
      http:
        endpoint: 10.42.0.1:4319

  # Host resource metrics — same scraper set and exclusions as config.yaml,
  # minus docker_stats (this host runs containerd under k3s; per-pod resource
  # attribution comes from kubeletstats below instead).
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load:
      memory:
        metrics:
          system.linux.memory.available:
            enabled: true
      paging:
      disk:
      network:
      filesystem:
        exclude_mount_points:
          mount_points:
            - /proc/*
            - /sys/*
            - /run/*
            - /dev/*
            - /var/lib/docker/*
            - /var/lib/rancher/*
            - /var/lib/kubelet/*
            - /snap/*
          match_type: regexp
        exclude_fs_types:
          fs_types:
            - autofs
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - mqueue
            - nsfs
            - overlay
            - proc
            - pstore
            - securityfs
            - selinuxfs
            - squashfs
            - sysfs
            - tmpfs
            - tracefs
          match_type: strict

  # k3s cluster-level health: node conditions, pod phases, deployment
  # available/desired replicas (the ARC controller, the per-repo ARC
  # listeners, the Kueue controller-manager), resource quotas. Talks to the
  # API server with the scoped ServiceAccount kubeconfig the installer renders
  # at /etc/otel-collector/kubeconfig (KUBECONFIG is set in the unit) — never
  # the admin k3s.yaml.
  k8s_cluster:
    auth_type: kubeConfig
    collection_interval: 30s
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
    # WHY a container is not running (livespec-dev-tooling v094 'Runner-pool
    # workload and control-plane telemetry', item ec2rkp). Off by default
    # upstream. last_terminated_reason rides the container RESOURCE, so every
    # container row says how it last died (OOMKilled, Error, Completed);
    # k8s.container.status.reason carries the CURRENT waiting/terminated reason
    # (CrashLoopBackOff, ImagePullBackOff, ContainerCreating, ...) as its
    # attribute, and .state says waiting/running/terminated.
    resource_attributes:
      k8s.container.status.last_terminated_reason:
        enabled: true
    metrics:
      k8s.container.status.reason:
        enabled: true
      k8s.container.status.state:
        enabled: true

  # Cluster EVENTS (same v094 section, ec2rkp): every core/v1 Warning event
  # the API server serves — FailedScheduling, BackOff, FailedMount, Evicted,
  # OOM kills reported by the kubelet — watched (not polled) so a burst is not
  # sampled away. Each arrives as one log record whose body is
  # {type, object: <Event>}; transform/k8s_events lifts the fields a query
  # needs into attributes. The scoped ClusterRole grants events get/list/watch.
  k8sobjects/events:
    auth_type: kubeConfig
    objects:
      - name: events
        mode: watch
        field_selector: type=Warning

  # PersistentVolumeClaim phase (same section, ec2rkp): pulled every 60 s,
  # one log record per claim with the claim object as its body; the count/pvc
  # connector turns them into a per-namespace, per-phase gauge in the metrics
  # dataset. The ClusterRole grants persistentvolumeclaims get/list/watch.
  k8sobjects/pvc:
    auth_type: kubeConfig
    objects:
      - name: persistentvolumeclaims
        mode: pull
        interval: 60s

  # Per-node / per-pod / per-container resource usage from EVERY node's
  # kubelet stats summary, proxied through the API server (auth_type
  # kubeConfig means a kubeletstats `endpoint` is the NODE NAME, not a
  # host:port). Until ci-runner-host.4 this was ONE kubeletstats receiver
  # pointed at OTEL_K8S_NODE_NAME, written for a single-node cluster; the
  # cluster grew to three nodes and gmktec's and hp's kubelets went unread
  # (livespec-dev-tooling plan kubernetes-node-observability, a2aiza).
  #
  # Now the k8s_observer extension watches the API server's Node objects and
  # receiver_creator starts one kubeletstats per node it sees, so a node that
  # joins is scraped with no edit here. receiver_creator also stamps
  # k8s.node.name (and k8s.node.uid) on the RESOURCE of everything that
  # instance emits — pod and container rows included — which is what
  # attributes a pod's usage to the node it runs on. The scoped ClusterRole in
  # k8s/otel-collector-rbac.yaml already grants nodes list/watch, nodes/proxy
  # and nodes/stats.
  #
  # The *_request_utilization / *_limit_utilization metrics are off by default
  # upstream; they are the per-pod "usage against what it asked for" that a
  # requests-vs-allocatable reading needs beside k8s_cluster's request and
  # limit gauges.
  receiver_creator/kubelets:
    watch_observers: [k8s_observer]
    receivers:
      kubeletstats:
        rule: type == "k8s.node"
        config:
          auth_type: kubeConfig
          endpoint: "`name`"
          collection_interval: 30s
          metric_groups: [node, pod, container]
          metrics:
            k8s.pod.cpu_request_utilization:
              enabled: true
            k8s.pod.cpu_limit_utilization:
              enabled: true
            k8s.pod.memory_request_utilization:
              enabled: true
            k8s.pod.memory_limit_utilization:
              enabled: true
            k8s.container.cpu_request_utilization:
              enabled: true
            k8s.container.cpu_limit_utilization:
              enabled: true
            k8s.container.memory_request_utilization:
              enabled: true
            k8s.container.memory_limit_utilization:
              enabled: true

extensions:
  # Watches Node objects only (pods are not needed: kubeletstats reads a
  # node's pods from that node's kubelet). Same scoped kubeconfig as the
  # receivers.
  k8s_observer:
    auth_type: kubeConfig
    observe_nodes: true
    observe_pods: false

processors:
  batch:
    timeout: 5s

  # k8s.container.status.reason and .state are ENUM metrics: one datapoint per
  # possible value, 1 for the container's actual reason or state and 0 for
  # every other. Each datapoint's attribute has the SAME NAME as the metric, so
  # in Honeycomb the attribute takes the column and the 0/1 value is lost. A
  # running factory sandbox then read OOMKilled, ErrImagePull and
  # CrashLoopBackOff all at once (measured 2026-10-27 on ci-runner-host.5).
  # Dropping the zero datapoints leaves exactly one row per container: the
  # reason and the state it actually has.
  filter/k8s_enum_inactive:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name == "k8s.container.status.reason" and value_int == 0'
        - 'metric.name == "k8s.container.status.state" and value_int == 0'

  # Stamp host.name (and os.type) on everything. config.yaml omits this because
  # its dataset is single-host; here every CI-runner host shares the env's one
  # metrics dataset, so the dead-man trigger is FILTERED to host.name = <this
  # host> (an ungrouped count filtered to one host fires on that host's
  # silence; a grouped query cannot — see the homelab "Floor 1 — dead-man"
  # trigger and livespec-s43svm.20).
  resourcedetection/system:
    detectors: [system]
    system:
      hostname_sources: [os]
    override: false

  # Workload attribution for k3s rows: the deployment / statefulset /
  # daemonset / job that owns a pod, matched by the pod uid kubeletstats and
  # k8s_cluster both put on the resource. Node and namespace already arrive
  # on the rows (receiver_creator stamps the node; both receivers carry the
  # namespace); this adds the OWNER, so "what is loading gmktec" reads as a
  # workload name rather than a pod hash. Same scoped kubeconfig; the
  # ClusterRole grants pods, namespaces, nodes and replicasets.
  k8sattributes:
    auth_type: kubeConfig
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
    extract:
      metadata:
        - k8s.node.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.job.name

  # host.name on a k3s row names the node the row is ABOUT. resourcedetection
  # above stamps THIS collector's host on every row that lacks one, which made
  # a pod on gmktec read as poweredge's; so where a row carries k8s.node.name,
  # host.name follows it, and the collector's own name moves to
  # collector.host.name. Rows with no node (cluster-scoped k8s_cluster
  # metrics: deployments, quotas) keep the collector's host.name, which is
  # what the existing host.name = poweredge-xubuntu queries read. IsString is
  # the presence check (see CLAUDE.md, OTTL gotcha 1).
  transform/k3s_host:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["collector.host.name"], attributes["host.name"]) where IsString(attributes["host.name"])
          - set(attributes["host.name"], attributes["k8s.node.name"]) where IsString(attributes["k8s.node.name"])

  # Lift a Warning event's fields out of the watch body into attributes, and
  # route the records to their own `k8s-events` dataset by service.name
  # (traces/logs auto-route by service.name in the livespec env). k8s.pod.name
  # is set only when the involved object IS a pod, so a pending pod's
  # FailedScheduling event joins that pod's rows on k8s.namespace.name +
  # k8s.pod.name. k8s.node.name is the reporting host when the event names one
  # (kubelet events do; scheduler events do not). IsMap / IsString / IsInt are
  # the presence checks (CLAUDE.md, OTTL gotcha 1).
  transform/k8s_events:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], "k8s-events")
      - context: log
        conditions:
          - 'IsMap(body) and IsMap(body["object"])'
        statements:
          - set(attributes["k8s.event.watch_type"], body["type"]) where IsString(body["type"])
          - set(attributes["k8s.namespace.name"], body["object"]["metadata"]["namespace"]) where IsString(body["object"]["metadata"]["namespace"])
          - set(attributes["k8s.event.name"], body["object"]["metadata"]["name"]) where IsString(body["object"]["metadata"]["name"])
          - set(attributes["k8s.event.type"], body["object"]["type"]) where IsString(body["object"]["type"])
          - set(attributes["k8s.event.reason"], body["object"]["reason"]) where IsString(body["object"]["reason"])
          - set(attributes["k8s.event.message"], body["object"]["message"]) where IsString(body["object"]["message"])
          - set(attributes["k8s.event.count"], body["object"]["count"]) where IsInt(body["object"]["count"])
          - set(attributes["k8s.event.object.kind"], body["object"]["involvedObject"]["kind"]) where IsString(body["object"]["involvedObject"]["kind"])
          - set(attributes["k8s.event.object.name"], body["object"]["involvedObject"]["name"]) where IsString(body["object"]["involvedObject"]["name"])
          - set(attributes["k8s.pod.name"], body["object"]["involvedObject"]["name"]) where body["object"]["involvedObject"]["kind"] == "Pod" and IsString(body["object"]["involvedObject"]["name"])
          - set(attributes["k8s.node.name"], body["object"]["source"]["host"]) where IsString(body["object"]["source"]["host"])
          - set(attributes["k8s.event.source.component"], body["object"]["source"]["component"]) where IsString(body["object"]["source"]["component"])

  # A pulled claim's namespace, name and phase, as the attributes count/pvc
  # groups by. The records are consumed by the connector only, never exported.
  transform/pvc:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - 'IsMap(body) and IsMap(body["metadata"])'
        statements:
          - set(attributes["k8s.namespace.name"], body["metadata"]["namespace"]) where IsString(body["metadata"]["namespace"])
          - set(attributes["k8s.persistentvolumeclaim.name"], body["metadata"]["name"]) where IsString(body["metadata"]["name"])
          - set(attributes["k8s.persistentvolumeclaim.phase"], body["status"]["phase"]) where IsString(body["status"]["phase"])

  # Marker processor, identical in purpose to config.yaml's: filter on
  # collector.otel-collector = "washere" to see only data that passed through
  # a collector in this repo. Version is per-config-file; this file starts its
  # own series at ci-runner-host.1 (now .5).
  transform/mark:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["collector.otel-collector"], "washere")
          - set(attributes["collector.otel-collector.version"], "ci-runner-host.7")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["collector.otel-collector"], "washere")
          - set(attributes["collector.otel-collector.version"], "ci-runner-host.7")
    log_statements:
      - context: resource
        statements:
          - set(attributes["collector.otel-collector"], "washere")
          - set(attributes["collector.otel-collector.version"], "ci-runner-host.7")

exporters:
  # ONE exporter: everything goes to the livespec env. Traces/logs auto-route
  # by service.name (no dataset header), exactly like otlp/honeycomb_livespec
  # in config.yaml. Metrics: the livespec env is a Honeycomb "Metrics 2.0"
  # environment, so EVERY OTLP metric lands in its single `metrics` dataset
  # and an x-honeycomb-dataset header is IGNORED there (measured 2026-08-23:
  # a header naming livespec-host-metrics created nothing; the rows appeared
  # in `metrics`). That differs from agent-activity, where the factory host's
  # header-pinned livespec-host-metrics dataset exists as an events-type
  # dataset. Host rows, the liveness gauges, and the k3s rows are therefore
  # told apart by metric name + host.name, not by dataset; the liveness
  # dead-man is COUNT_DATAPOINTS(livespec.ci_runners.active) filtered to
  # host.name = <this host>.
  otlp/honeycomb_livespec:
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_INGEST_KEY_LIVESPEC}

connectors:
  # One datapoint per (namespace, claim, phase) per 60 s pull: the claim's
  # phase, per namespace, in the metrics dataset (ec2rkp). A claim reads 1
  # under its current phase; summing by namespace + phase gives the
  # per-namespace phase counts.
  #
  # The METRIC is k8s.persistentvolumeclaim.claims, never .phase. A metric
  # named like one of its own attributes collides with it in Honeycomb: the
  # count overwrote the phase string, and every claim read phase "0"
  # (measured 2026-10-27 on ci-runner-host.5 and .6).
  count/pvc:
    logs:
      k8s.persistentvolumeclaim.claims:
        description: PersistentVolumeClaims observed in a phase at the last pull (1 per claim).
        conditions:
          - 'IsString(attributes["k8s.persistentvolumeclaim.phase"])'
        attributes:
          - key: k8s.namespace.name
          - key: k8s.persistentvolumeclaim.name
          - key: k8s.persistentvolumeclaim.phase

service:
  extensions: [k8s_observer]
  pipelines:
    traces:
      receivers: [otlp, otlp/pods]
      processors: [resourcedetection/system, transform/mark, batch]
      exporters: [otlp/honeycomb_livespec]
    logs:
      receivers: [otlp]
      processors: [resourcedetection/system, transform/mark, batch]
      exporters: [otlp/honeycomb_livespec]
    # On this host the only OTLP metrics emitter is ci-runner-heartbeat.sh.
    # Two metrics pipelines with one destination: kept separate so the k3s
    # receivers (high-cardinality per-pod rows) can be tuned or re-routed
    # without touching the host/liveness path the triggers depend on.
    metrics/host:
      receivers: [hostmetrics, otlp]
      processors: [resourcedetection/system, transform/mark, batch]
      exporters: [otlp/honeycomb_livespec]
    metrics/k3s:
      receivers: [k8s_cluster, receiver_creator/kubelets]
      processors: [filter/k8s_enum_inactive, k8sattributes, resourcedetection/system, transform/k3s_host, transform/mark, batch]
      exporters: [otlp/honeycomb_livespec]
    # Warning events -> the k8s-events dataset (ec2rkp).
    logs/k8s_events:
      receivers: [k8sobjects/events]
      processors: [transform/k8s_events, resourcedetection/system, transform/mark, batch]
      exporters: [otlp/honeycomb_livespec]
    # Claim objects -> count/pvc only; the raw objects are never exported.
    logs/pvc:
      receivers: [k8sobjects/pvc]
      processors: [transform/pvc]
      exporters: [count/pvc]
    metrics/pvc:
      receivers: [count/pvc]
      processors: [resourcedetection/system, transform/mark, batch]
      exporters: [otlp/honeycomb_livespec]
