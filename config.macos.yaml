receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 5s

  transform/mark_local:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(resource.attributes["collector.agent-activity-local"], "washere")
          - set(resource.attributes["collector.agent-activity-local.version"], "0.1")
          - set(resource.attributes["collector.agent-activity-local.host"], "macos")
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes["collector.agent-activity-local"], "washere")
          - set(resource.attributes["collector.agent-activity-local.version"], "0.1")
          - set(resource.attributes["collector.agent-activity-local.host"], "macos")
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["collector.agent-activity-local"], "washere")
          - set(resource.attributes["collector.agent-activity-local.version"], "0.1")
          - set(resource.attributes["collector.agent-activity-local.host"], "macos")

  transform/codex_normalize:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(span.attributes["gen_ai.conversation.id"], span.attributes["conversation.id"]) where IsString(span.attributes["conversation.id"])
          - set(span.attributes["gen_ai.conversation.id"], span.attributes["session.id"]) where not IsString(span.attributes["gen_ai.conversation.id"]) and IsString(span.attributes["session.id"])
          - set(span.attributes["gen_ai.tool.name"], span.attributes["tool.name"]) where IsString(span.attributes["tool.name"])
          - set(span.attributes["gen_ai.tool.name"], span.attributes["tool_name"]) where not IsString(span.attributes["gen_ai.tool.name"]) and IsString(span.attributes["tool_name"])
          - set(span.attributes["gen_ai.tool.call.id"], span.attributes["tool.call_id"]) where IsString(span.attributes["tool.call_id"])
          - set(span.attributes["gen_ai.tool.call.id"], span.attributes["call_id"]) where not IsString(span.attributes["gen_ai.tool.call.id"]) and IsString(span.attributes["call_id"])
          - set(span.attributes["gen_ai.usage.input_tokens"], span.attributes["codex.turn.token_usage.input_tokens"]) where IsInt(span.attributes["codex.turn.token_usage.input_tokens"])
          - set(span.attributes["gen_ai.usage.output_tokens"], span.attributes["codex.turn.token_usage.output_tokens"]) where IsInt(span.attributes["codex.turn.token_usage.output_tokens"])
          - set(span.attributes["gen_ai.usage.total_tokens"], span.attributes["codex.turn.token_usage.total_tokens"]) where IsInt(span.attributes["codex.turn.token_usage.total_tokens"])
          - set(span.attributes["route"], span.attributes["api.path"]) where IsString(span.attributes["api.path"])

exporters:
  otlp/honeycomb:
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/mark_local, transform/codex_normalize, batch]
      exporters: [otlp/honeycomb]
    logs:
      receivers: [otlp]
      processors: [transform/mark_local, batch]
      exporters: [otlp/honeycomb]
    metrics:
      receivers: [otlp]
      processors: [transform/mark_local, batch]
      exporters: [otlp/honeycomb]
